name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Build macOS universal DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Install FFmpeg for bundled runtime
        run: brew install ffmpeg

      - name: Build universal DMG
        run: |
          chmod +x scripts/package_app.sh scripts/package_dmg.sh scripts/generate_icon.swift scripts/generate_app_icon.sh scripts/generate_dmg_background.swift scripts/bundle_ffmpeg.sh
          scripts/generate_app_icon.sh
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
            VERSION="${VERSION#v}"
          fi
          AUDIOX_VERSION="$VERSION" scripts/package_dmg.sh arm64
          AUDIOX_VERSION="$VERSION" scripts/package_dmg.sh intel
          AUDIOX_VERSION="$VERSION" scripts/package_dmg.sh universal

      - name: Prepare release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
            VERSION="${VERSION#v}"
          fi
          mkdir -p release
          cp "dist/AudioX-$VERSION-arm64.dmg" release/
          cp "dist/AudioX-$VERSION-intel.dmg" release/
          cp "dist/AudioX-$VERSION-universal.dmg" release/
          cd release
          shasum -a 256 *.dmg > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioX-release-dmgs
          path: |
            release/*.dmg
            release/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          NOTES="AudioX macOS DMG builds.

          Runtime:
          - Requires macOS 15.0 or later.
          - Xcode is not required.
          - FFmpeg is bundled.
          - MP3/WAV/M4A/AAC work natively.
          - OGG/OPUS/FLAC/P3 are supported through the bundled FFmpeg runtime.

          Assets:
          - AudioX-$VERSION-arm64.dmg for Apple Silicon
          - AudioX-$VERSION-intel.dmg for Intel Macs
          - AudioX-$VERSION-universal.dmg for both architectures"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/*.dmg release/SHA256SUMS --clobber
          else
            gh release create "$TAG_NAME" release/*.dmg release/SHA256SUMS \
              --title "AudioX $TAG_NAME" \
              --notes "$NOTES"
          fi
